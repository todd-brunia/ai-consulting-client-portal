name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_playwright:
        description: Run the complete Chromium Playwright suite regardless of changed paths
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast-validation:
    name: Fast validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  detect-supabase-changes:
    name: Detect Supabase-relevant changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - name: Check out history without executing repository code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect relevant paths
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          required=false

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            required=true
          else
            mapfile -t patterns < <(sed '/^[[:space:]]*$/d' .github/ci-supabase-paths.txt)
            while IFS= read -r -d '' changed_path; do
              case "$changed_path" in
                .github/workflows/ci.yml|.github/ci-supabase-paths.txt)
                  required=true
                  break
                  ;;
              esac

              for pattern in "${patterns[@]}"; do
                if [[ "$changed_path" == $pattern ]]; then
                  required=true
                  break 2
                fi
              done
            done < <(git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [[ "$required" == true ]]; then
            echo "Supabase integration checks are required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Supabase integration checks are intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  supabase-integration:
    name: Supabase integration
    needs: detect-supabase-changes
    if: needs.detect-supabase-changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start isolated Supabase stack
        run: npm run supabase:start > /dev/null
      - name: Reset database from tracked migrations
        run: npm run supabase:reset
      - name: Lint Supabase schema
        run: npm run supabase:lint
      - name: Provision deterministic integration fixtures
        run: npm run supabase:test:fixtures
      - name: Test authenticated PostgreSQL tenant isolation
        run: npm run test:integration:rls
      - name: Test authenticated engagements JSON:API endpoint
        run: npm run test:integration:api
      - name: Stop and remove Supabase stack
        if: always()
        run: npm run supabase:stop -- --no-backup > /dev/null

  detect-playwright-changes:
    name: Detect Playwright-relevant changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - name: Check out history without executing repository code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect relevant paths
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_PLAYWRIGHT: ${{ github.event_name == 'workflow_dispatch' && inputs.run_playwright == true }}
        shell: bash
        run: |
          set -euo pipefail
          required="$(node .github/scripts/playwright-relevant-paths.mjs)"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [[ "$required" == true ]]; then
            echo "Chromium Playwright is required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Chromium Playwright is intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  playwright:
    name: Chromium Playwright
    needs: detect-playwright-changes
    if: needs.detect-playwright-changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Start isolated Supabase stack
        run: npm run supabase:start > /dev/null
      - name: Reset database from tracked migrations
        run: npm run supabase:reset
      - name: Run production-built Chromium regression suite
        id: browser_tests
        run: npm run test:e2e
      - name: Verify failure artifacts contain no server credentials
        id: artifact_safety
        if: failure() && steps.browser_tests.outcome == 'failure'
        run: node .github/scripts/playwright-artifact-safety.mjs playwright-report test-results
      - name: Upload secret-safe Playwright failure diagnostics
        if: failure() && steps.browser_tests.outcome == 'failure' && steps.artifact_safety.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
      - name: Stop and remove Supabase stack
        if: always()
        run: npm run supabase:stop -- --no-backup > /dev/null

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - fast-validation
      - detect-supabase-changes
      - supabase-integration
      - detect-playwright-changes
      - playwright
    runs-on: ubuntu-latest
    steps:
      - name: Check out CI Gate contract
        uses: actions/checkout@v5
      - name: Verify required checks
        env:
          FAST_RESULT: ${{ needs.fast-validation.result }}
          DETECTOR_RESULT: ${{ needs.detect-supabase-changes.result }}
          INTEGRATION_REQUIRED: ${{ needs.detect-supabase-changes.outputs.required }}
          INTEGRATION_RESULT: ${{ needs.supabase-integration.result }}
          PLAYWRIGHT_REQUIRED: ${{ needs.detect-playwright-changes.outputs.required }}
          PLAYWRIGHT_DETECTOR_RESULT: ${{ needs.detect-playwright-changes.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FAST_RESULT" != success ]]; then
            echo "Fast validation result: $FAST_RESULT" >&2
            exit 1
          fi
          if [[ "$DETECTOR_RESULT" != success ]]; then
            echo "Path detector result: $DETECTOR_RESULT" >&2
            exit 1
          fi
          if [[ "$PLAYWRIGHT_DETECTOR_RESULT" != success ]]; then
            echo "Playwright path detector result: $PLAYWRIGHT_DETECTOR_RESULT" >&2
            exit 1
          fi
          case "$INTEGRATION_REQUIRED:$INTEGRATION_RESULT" in
            true:success|false:skipped) ;;
            *)
              echo "Supabase integration contract: required=$INTEGRATION_REQUIRED result=$INTEGRATION_RESULT" >&2
              exit 1
              ;;
          esac
          node .github/scripts/ci-gate-contract.mjs "$PLAYWRIGHT_REQUIRED" "$PLAYWRIGHT_RESULT"
          echo "CI gate passed with Supabase integration: $INTEGRATION_RESULT and Chromium Playwright: $PLAYWRIGHT_RESULT"
